name: CI

# Public repo, so hosted minutes are free (decision F-6).
# Every non-draft PR and every push to main runs types, unit tests, build and the browser suites.
# Docs-only changes skip CI. If Actions is unavailable, scripts/ci-local.sh posts the same checks as commit statuses (docs/testing.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    # Skip draft PRs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    concurrency:
      group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
      # A newer push cancels the older run of a PR; every merge to main keeps its own run.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      # The browser suites need the `?test` hooks, which only a test build has (F-219).
      - run: npm run build
        env:
          YAK_TEST_BUILD: '1'
      - run: npm run check:bundle
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e -- --no-build
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7
